[package]
name = "discord-vr-desktop"
version = "0.2.1"
edition = "2021"
description = "Discord notifications in VR — Tauri desktop app"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "discord_To_VR"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
discord-vr-core = { package = "discord_To_VR", path = ".." }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Controls_Dialogs", "Win32_UI_Shell"] }
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
