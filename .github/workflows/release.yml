name: Build and Release

on:
  push:
    branches: [release]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate release version
        id: release-version
        run: |
          node scripts/release-manifest.mjs --validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $appVersion = (Get-Content -Raw -Encoding UTF8 'src-tauri/tauri.conf.json' | ConvertFrom-Json).version
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$appVersion" -Encoding utf8
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and !(Test-Path -LiteralPath "docs/release-notes/$($env:GITHUB_REF_NAME).md" -PathType Leaf)) {
            throw 'Write the changes since the previous release in docs/release-notes before publishing.'
          }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Regression tests
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --features custom-protocol
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/release-manifest.test.mjs
      - name: Build signed release
        if: github.ref_type == 'tag'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing.'
          }
          npm run desktop:build -- --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/release-manifest.mjs
      - name: Build branch preview without update publication
        if: github.ref_type != 'tag'
        run: |
          $override = Join-Path $env:RUNNER_TEMP 'tauri-preview.json'
          [IO.File]::WriteAllText($override, '{"bundle":{"createUpdaterArtifacts":false}}')
          npm run desktop:build -- --ci --config $override -- --locked
      - name: Verify uninstall data cleanup
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test-installer-hooks.ps1
      - name: Package ZIP archive
        shell: powershell
        run: |
          $files = @("target\tauri\release\discord_To_VR.exe", "README.md", "CHANGELOG.md", "config.example.json", "SECURITY.md", "IMPROVEMENTS.md", "LICENSE", "docs")
          if (Test-Path -LiteralPath "target\tauri\release\WebView2Loader.dll") {
            $files += "target\tauri\release\WebView2Loader.dll"
          }
          Compress-Archive -LiteralPath $files -DestinationPath discord_To_VR-tauri.zip -Force
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-to-vr-windows
          path: |
            discord_To_VR-tauri.zip
            target/tauri/release/bundle/nsis/Discord to VR_${{ steps.release-version.outputs.version }}_x64-setup.exe
            target/tauri/release/bundle/nsis/Discord to VR_${{ steps.release-version.outputs.version }}_x64-setup.exe.sig
            latest.json
      - name: Publish stable GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            discord_To_VR-tauri.zip
            target/tauri/release/bundle/nsis/Discord to VR_${{ steps.release-version.outputs.version }}_x64-setup.exe
            target/tauri/release/bundle/nsis/Discord to VR_${{ steps.release-version.outputs.version }}_x64-setup.exe.sig
            latest.json
          fail_on_unmatched_files: true
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          make_latest: true
