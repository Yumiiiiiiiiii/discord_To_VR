[package]
name = "discord_To_VR"
version = "0.1.0"
edition = "2021"
description = "Discord notifications in VR (XSOverlay)"

[lib]
name = "discord_vr_core"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_System_Registry", "Win32_Graphics_Dwm", "Win32_UI_Controls_Dialogs"] }

[dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_Xps"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
